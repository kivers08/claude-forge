name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # Runs on the org's self-hosted corp runner (kewi-dev: self-hosted, Linux,
    # X64, dev; runner group Default) when the CORP_RUNNER repo/org variable
    # is set to "true"; otherwise falls back to GitHub-hosted. Actions has no
    # built-in way to detect at trigger time whether a self-hosted runner is
    # actually online (querying runner liveness needs an org-admin-scoped
    # token the default GITHUB_TOKEN doesn't have), so this variable is the
    # manual switch: flip it in Settings > Secrets and variables > Actions >
    # Variables when kewi-dev is up, flip it back if it goes down.
    runs-on: ${{ vars.CORP_RUNNER == 'true' && fromJSON('["self-hosted", "dev"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --check every .js
        run: |
          set -e
          find plugins scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Node-only manifest and frontmatter validator
        run: node scripts/validate-plugins.js --strict
      - name: Hook unit runs (forge)
        run: node plugins/forge/hooks/tests/run.js
      - name: Hook unit runs (smoke)
        run: test -d plugins/smoke && node plugins/forge/hooks/tests/run.js --plugin plugins/smoke || echo "no smoke plugin"
      - name: Project SessionStart hook unit tests
        run: .claude/hooks/tests/session-start.test.sh
      - name: LF line endings enforced
        run: |
          if git ls-files --eol | grep -E 'w/crlf|w/mixed'; then
            echo "CRLF found"; exit 1
          fi
      - name: claude plugin validate --strict (if CLI installs)
        continue-on-error: true
        run: |
          if npm install -g @anthropic-ai/claude-code >/dev/null 2>&1; then
            claude plugin validate . --strict
            for p in plugins/*/; do claude plugin validate "$p" --strict; done
          else
            echo "claude CLI not installable in CI; Node validator is authoritative"
          fi
