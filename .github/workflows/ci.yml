name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Draft PRs run no expensive/self-hosted CI: `validate`, `forge-validators`
    # and `reviewer clean` each carry a `draft == false` gate, so the
    # intermediate build/review/fix commits on a unit branch don't churn the
    # single self-hosted runner. `t0-auto-merge` is the one exception — it
    # runs on drafts too, on purpose, so its revoke path stays reachable (see
    # that job's comment). `ready_for_review` is listed so that marking a PR
    # ready — the deliberate "this unit is done" signal — fires the workflow
    # and runs the full suite exactly once. `synchronize` still covers pushes to
    # an already-ready PR (e.g. a post-CI fix), which should re-run.
    types: [opened, synchronize, reopened, ready_for_review]

# Single self-hosted runner: without this, every push to an already-ready PR
# queues another full set of jobs behind the ones still running, and the queue
# — not the ~7s of actual check work — becomes the wall-clock cost. Group per
# ref and cancel superseded runs.
#
# Safe for the `reviewer clean` commit status specifically: that status is
# posted per head SHA, so cancelling the run for a superseded SHA cannot leave
# the SHA anyone would merge without a status. Pushes to main are NOT cancelled
# (github.run_id makes each its own group), since a main run is the record for
# a commit that is already merged.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fork-PR safety (all jobs): a fork PR is arbitrary untrusted code that this
  # workflow checks out and executes (validate-plugins.js, the hook test
  # runners), so it must never land on the persistent self-hosted runner, which
  # carries the owner's $HOME and `claude` login. `validate` and
  # `forge-validators` therefore fall back to a GitHub-hosted runner for fork
  # PRs rather than being skipped — the checks still have to run. `reviewer
  # clean` is skipped outright instead, since it has no meaning without that
  # machine's `claude` login. A repository Actions setting requiring approval
  # for outside collaborators is the belt to this braces.
  validate:
    # Runs on the org's self-hosted corp runner (kewi-dev: self-hosted, Linux,
    # X64, dev; runner group Default) when the CORP_RUNNER repo/org variable
    # is set to "true"; otherwise falls back to GitHub-hosted. Actions has no
    # built-in way to detect at trigger time whether a self-hosted runner is
    # actually online (querying runner liveness needs an org-admin-scoped
    # token the default GITHUB_TOKEN doesn't have), so this variable is the
    # manual switch: flip it in Settings > Secrets and variables > Actions >
    # Variables when kewi-dev is up, flip it back if it goes down.
    # Draft gate: skip while the PR is a draft; still runs on push-to-main.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ (vars.CORP_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "dev"]') || 'ubuntu-latest' }}
    # The whole suite is ~7s of real work; anything past a couple of minutes
    # means a hung child process, not a slow check. On the single self-hosted
    # runner an unbounded hang wedges every other job behind it, and the
    # Actions default is 360 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Fail-fast ordering, cheapest-and-broadest first. This step needs no
      # Node at all, so it runs before setup-node: a CRLF-infected branch is
      # rejected in seconds instead of after the full suite.
      - name: LF line endings enforced
        run: |
          if git ls-files --eol | grep -E 'w/crlf|w/mixed'; then
            echo "CRLF found"; exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      # Broadest gate in the suite: a syntax error anywhere invalidates every
      # test below it, so it stays first among the Node steps. `-P 4` parses
      # the ~40 files concurrently — the cost here is process spawn, not
      # parsing, so the fan-out is most of the step's runtime.
      - name: node --check every .js
        run: |
          set -e
          find plugins scripts -name '*.js' -print0 | xargs -0 -P 4 -n1 node --check
      - name: Node-only manifest and frontmatter validator
        run: node scripts/validate-plugins.js --strict
      # Sub-100ms unit tests next: highest signal per second, and they cover
      # the tier resolver and hook surfaces the slower suites build on.
      - name: Tier resolver unit tests (D17)
        run: node plugins/forge/hooks/tests/tier.test.js
      - name: segment-split tokenizer unit tests (D27)
        run: node plugins/forge/hooks/tests/segment-split.test.js
      - name: memory-redact hook unit tests (D28.4)
        run: node plugins/forge/hooks/tests/memory-redact.test.js
      - name: redact lib unit tests (D28.4)
        run: node plugins/forge/hooks/tests/redact.test.js
      - name: telemetry flush emitter unit tests (D29)
        run: node plugins/forge/hooks/tests/telemetry-flush.test.js
      - name: subagent telemetry parseOutcome unit tests (D29/D30)
        run: node plugins/forge/hooks/tests/subagent-telemetry.test.js
      - name: Project SessionStart hook unit tests
        run: .claude/hooks/tests/session-start.test.sh
      - name: reviewer-clean-check unit tests
        run: node scripts/tests/reviewer-clean-check.test.js
      - name: changelog tooling unit tests (containment, symlinks, crash-safety)
        run: node scripts/tests/changelog.test.js
      - name: t0-auto-merge unit tests (revoke attribution, state tri-state)
        run: node scripts/tests/t0-auto-merge.test.js
      # Slowest deterministic steps last, so a cheap failure never pays for
      # them. `run.js` alone is ~3s — roughly half the suite's total work.
      - name: Hook unit runs (forge)
        run: node plugins/forge/hooks/tests/run.js
      - name: Hook unit runs (smoke)
        run: test -d plugins/smoke && node plugins/forge/hooks/tests/run.js --plugin plugins/smoke || echo "no smoke plugin"
      - name: claude plugin validate --strict (if CLI installs)
        continue-on-error: true
        # Step-level bound, separate from the job's 10-minute `timeout-minutes`:
        # this step is tolerated-failure by design (an npm install that cannot
        # complete is not this job's problem), but without its own timeout a
        # stall here would burn the whole job budget and hard-fail `validate`
        # via the job-level timeout instead of being swallowed by
        # continue-on-error.
        timeout-minutes: 3
        run: |
          # Skip the (re)install when claude is already on PATH — true on
          # the persistent self-hosted runner, where reviewer-clean already
          # depends on it being present and authenticated. Avoids a
          # redundant npm-registry round-trip on every single run; still
          # installs it fresh on the GitHub-hosted fallback where it isn't.
          if command -v claude >/dev/null 2>&1 || npm install -g @anthropic-ai/claude-code >/dev/null 2>&1; then
            claude plugin validate . --strict
            for p in plugins/*/; do claude plugin validate "$p" --strict; done
          else
            echo "claude CLI not installable in CI; Node validator is authoritative"
          fi

  forge-validators:
    # D20/D21 required status check "forge validators": deterministic,
    # no judgment calls, fails the build on any problem. Unlike
    # `reviewer-clean` below, neither check this job runs needs the
    # self-hosted machine — both are pure Node with no external CLI/auth
    # dependency — so, unlike `reviewer-clean`, this job always runs both
    # checks regardless of which runner it lands on; gating a required,
    # deterministic check behind runner availability would let it silently
    # no-op on the exact fallback path it exists to still catch problems on.
    # Deliberately reruns `validate-plugins.js --strict` (already run,
    # unconditionally, in the `validate` job above) alongside the new
    # changelog fragment shape check (D21) that `validate` does not run —
    # not a silent duplicate: same deterministic script, so the two checks
    # cannot disagree, and this is the check name branch protection will
    # eventually require (D20).
    name: forge validators
    # Draft gate: skip while the PR is a draft; still runs on push-to-main.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ (vars.CORP_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "dev"]') || 'ubuntu-latest' }}
    # ~1s of work. Deliberately kept as its own job rather than folded into
    # `validate`: it is the required check name (D20), so it must stay
    # independently reportable and must not inherit `validate`'s failures.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - name: manifest/frontmatter + changelog fragment validators
        run: |
          node scripts/validate-plugins.js --strict
          node scripts/validate-changelog.js

  reviewer-clean:
    # D20 "reviewer clean" commit status: dispatches the forge:reviewer
    # agent headlessly via `claude -p` on the self-hosted runner only,
    # reusing whatever `claude` login already exists on that machine (the
    # owner's subscription auth) — no ANTHROPIC_API_KEY or other new
    # secret. Posts to GitHub via the workflow's own GITHUB_TOKEN. On the
    # GitHub-hosted fallback, or if `claude` isn't on PATH/authenticated,
    # scripts/reviewer-clean-check.js posts a graceful "success: skipped"
    # status rather than failing the build (same pattern as the two steps
    # above). Runs only for pull_request events, since there is no PR diff
    # to review otherwise. Also gated to same-repo PRs: this job lands on
    # the persistent self-hosted runner and reuses the owner's `claude`
    # login/HOME, so a fork PR (arbitrary untrusted code, not just diff
    # content, checked out and executed by validate-plugins.js etc. before
    # reviewer-clean-check.js even runs) must not reach that machine. A
    # fork PR also can't post a status with a read-only GITHUB_TOKEN, so it
    # could not go green here in any case. Note for D26: `reviewer clean` is
    # an API-posted commit *status*, not this job's check run, so an
    # if:-skipped job posts nothing at that context — the "a skipped job
    # counts as success" rule does not apply. Once branch protection requires
    # this context, fork PRs will block pending a human. That is the intended
    # outcome, not an oversight: a fork PR is exactly the case that should not
    # be able to self-certify.
    name: reviewer clean
    # Fail fast: this is the single most expensive thing CI does — a `claude -p`
    # reviewer dispatch, capped at 15 minutes, holding the one self-hosted
    # runner and burning the owner's subscription quota. Never start it for a
    # PR that a ~1s deterministic check already rejected. Both gates are
    # draft-gated the same way this job is, so a draft PR skips all three
    # together and this cannot deadlock.
    #
    # Trade-off, deliberate: when `validate` or `forge validators` fails, this
    # job is skipped and posts NO `reviewer clean` status for that SHA (it is
    # an API commit status, not a check run, so skipping posts nothing). Once
    # D26 makes the context required, such a SHA reads pending rather than
    # failing. It is unmergeable either way — the deterministic check is red —
    # and the next push re-runs the chain.
    needs: [validate, forge-validators]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ${{ vars.CORP_RUNNER == 'true' && fromJSON('["self-hosted", "dev"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      statuses: write
    # Defense in depth alongside reviewer-clean-check.js's own internal
    # spawnSync timeout: this job runs on the single self-hosted runner, so
    # an unbounded hang here would block every other CI job on that runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # actions/checkout defaults to persist-credentials: true, which
          # writes an http.extraheader carrying `Authorization: basic
          # <base64 x-access-token:GITHUB_TOKEN>` into <workspace>/.git/config
          # for the life of the job. reviewer-clean-check.js deliberately
          # withholds GITHUB_TOKEN from the reviewer child's environment
          # because the diff it reviews is untrusted PR content — but that
          # scrub is bypassed on disk: .git/config sits inside --add-dir ROOT,
          # so the child's Read/Grep tools cover it, and the job log prints the
          # full reviewer output on every failure path. Actions masks the raw
          # token, not its base64 form. This job never pushes, so dropping the
          # credential entirely costs nothing.
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      # The decision CODE must come from the base ref, not the PR's checkout —
      # otherwise a PR can edit scripts/reviewer-clean-check.js to delete its
      # own ack/token/truncation/instruction-surface gates and self-certify.
      # Same reasoning and same shape as the t0-auto-merge job above; that job
      # explains the RUNNER_TEMP-not-the-checkout and tolerated-failure choices
      # in full. reviewer-clean-check.js requires only Node stdlib, so `scripts`
      # alone is enough (no plugins/forge/hooks/lib, unlike the t0 job).
      - name: extract decision tooling from the base ref
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          rm -rf "$RUNNER_TEMP/base-tools"
          mkdir -p "$RUNNER_TEMP/base-tools"
          git archive "origin/$GITHUB_BASE_REF" scripts \
            | tar -x -C "$RUNNER_TEMP/base-tools" || echo "base ref has no scripts/ yet"
      - name: reviewer clean (dispatch forge:reviewer, post commit status)
        env:
          CORP_RUNNER: ${{ vars.CORP_RUNNER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # Point the base-ref copy (which lives outside the workspace) at the
          # real checkout for its git calls, the diff file, and --add-dir.
          FORGE_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -uo pipefail
          BASE="$RUNNER_TEMP/base-tools/scripts/reviewer-clean-check.js"
          # Run the base-ref copy so a PR can't rewrite the gate. Fall back to
          # the PR's own copy ONLY on the bootstrap PR that introduces base-ref
          # execution — detected by the FORGE_REPO_ROOT marker, since a base
          # copy predating this support ignores the override, resolves ROOT to
          # its own out-of-tree location, and fails every git call. Once this
          # PR merges, the base always has the marker and this branch is dead.
          if [ -f "$BASE" ] && grep -q FORGE_REPO_ROOT "$BASE"; then
            node "$BASE"
          else
            echo "reviewer clean: base ref predates FORGE_REPO_ROOT-aware check;"
            echo "reviewer clean: running the PR's own copy (bootstrap only)."
            node scripts/reviewer-clean-check.js
          fi

  t0-auto-merge:
    # D19 T0 exception: when a PR's changed paths resolve (D17, via
    # scripts/t0-auto-merge.js reusing plugins/forge/hooks/lib/tier.js — the
    # same resolver `dispatch` uses to classify a unit; the merge-gate hook
    # has NO tier exception, D19 revised) to tier T0 (docs/bookkeeping),
    # this enables GitHub's own auto-merge (squash) instead of waiting on
    # the explicit human "merge" + merge-gate marker every other tier still
    # requires, and posts a PR comment naming the owner so this is never a
    # silent merge. Every other tier is left untouched. GitHub-hosted
    # runner is fine here — no self-hosted `claude` login is needed, only
    # `gh` (preinstalled on GitHub-hosted runners) and Node.
    name: T0 auto-merge (D19)
    # Deliberately NOT gated behind `needs`/draft the way `reviewer clean` is.
    # This job runs on `ubuntu-latest` (hosted), so a `needs` gate here buys
    # latency, not the self-hosted VPS time `reviewer clean`'s gating exists
    # to save — there is no expensive-job cost to protect against. More
    # importantly, `scripts/t0-auto-merge.js` has a REVOKE path: when a PR is
    # a draft (or its diff/config cannot be resolved), it disables a stale
    # auto-merge grant. Adding `needs: [validate, forge-validators]` and a
    # `draft == false` clause here — as an earlier version of this file did —
    # made the job skip outright on drafts, which makes the revoke path
    # unreachable exactly when it matters (a PR converted back to draft after
    # gaining a non-T0 commit), and reordered a security-relevant revoke
    # behind checks that have nothing to do with whether a stale grant should
    # be torn down. If gating the ENABLE path specifically (not the revoke
    # path) on the deterministic checks is ever wanted, do it inside
    # `t0-auto-merge.js`, which can read check-run states itself before
    # calling `gh pr merge --auto` — not here, where it would gate revoke too.
    # Same-repo only, like `reviewer clean`: this job can enable auto-merge,
    # so a fork PR must never reach it. It needs no self-hosted runner, but
    # it does make a merge decision, which is the stronger reason to gate it.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Bounded like every other job: the Actions default of 360 minutes is not
    # a useful failure mode for a job that resolves a tier and makes one API
    # call.
    timeout-minutes: 10
    permissions:
      # INTERIM, deliberately below what the feature needs. `gh pr merge
      # --auto` runs the enablePullRequestAutoMerge mutation, which needs
      # contents: write. But this workflow file itself comes from the PR's
      # merge ref, so a PR can append a step to this job and inherit its
      # token — with contents: write that is enough to merge itself. The
      # feature is dormant anyway (branch protection is unavailable here, see
      # the D20 blocker), so nothing is lost by withholding the write scope
      # until the T0 job moves to its own pull_request_target workflow (the
      # D19 follow-up), which is the shape where granting it is safe. Restore
      # contents: write there, not here.
      contents: read
      # Also read, for the same reason: an appended step inherits whatever
      # scope is granted here, and pull-requests: write lets it post or edit
      # PR comments and request reviewers. The owner-notification comment
      # this script posts is unreachable anyway while the enable call cannot
      # succeed under contents: read. Both scopes come back together in the
      # pull_request_target workflow (D19 follow-up), which is the only shape
      # where an inherited token is safe to grant.
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The tier is resolved from the BASE ref's .claude/forge.json (a PR
          # must not be able to declare itself T0), so the base ref has to be
          # present locally.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      # The decision CODE must come from the base ref too, not just the config
      # it reads. The job checks out the PR, so running scripts/t0-auto-merge.js
      # (and the lib/tier.js it requires) straight from that checkout would let
      # a PR rewrite the logic that decides whether it may skip the human-merge
      # marker — the same hole reading .claude/forge.json from the base ref
      # closes for the data. Same-repo-only limits this to actors with push
      # access, but an autonomous agent with push access is precisely what
      # merge-gate.js exists to gate.
      - name: extract decision tooling from the base ref
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          # Outside the workspace, and cleared first. `tar -x` OVERLAYS rather
          # than clearing, so extracting into the PR's own checkout let a PR
          # that commits .base-tools/scripts/t0-auto-merge.js supply the very
          # "base-ref" code this step exists to obtain from a ref the author
          # cannot write — the file survives extraction and the guard below
          # sees it present. RUNNER_TEMP is outside the checkout entirely.
          rm -rf "$RUNNER_TEMP/base-tools"
          mkdir -p "$RUNNER_TEMP/base-tools"
          # Tolerated failure: the base ref legitimately lacks this tooling on
          # the very PR that introduces it (bootstrapping), and `git archive`
          # errors on a path that doesn't exist in the ref. The next step
          # fails closed on a missing copy rather than silently falling back
          # to the PR's own — which is the whole point of extracting it.
          git archive "origin/$GITHUB_BASE_REF" scripts plugins/forge/hooks/lib \
            | tar -x -C "$RUNNER_TEMP/base-tools" || echo "base ref has no decision tooling yet"
      - name: resolve tier, enable auto-merge for T0, notify owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Point the base-ref copy of the script at the real checkout for its
          # git calls, since it lives outside the workspace.
          FORGE_REPO_ROOT: ${{ github.workspace }}
          # Actions variables are not auto-injected into the process env, so
          # without this the documented per-repo override is inert.
          FORGE_OWNER_HANDLE: ${{ vars.FORGE_OWNER_HANDLE }}
        run: |
          if [ ! -f "$RUNNER_TEMP/base-tools/scripts/t0-auto-merge.js" ]; then
            echo "t0-auto-merge: base ref has no trusted copy of the decision"
            echo "t0-auto-merge: tooling (expected on the PR that introduces it)."
            echo "t0-auto-merge: NOT enabling auto-merge — running the PR's own"
            echo "t0-auto-merge: copy would let a PR decide its own merge path."
            echo "t0-auto-merge: leaving this PR on the explicit-merge path."
            exit 0
          fi
          node "$RUNNER_TEMP/base-tools/scripts/t0-auto-merge.js"
